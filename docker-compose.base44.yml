services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
    command: ["sh", "-ec", "apt-get update -qq && apt-get install -y -qq python3 make g++ > /dev/null 2>&1 && corepack enable && pnpm install && exec node --watch index.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
