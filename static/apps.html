<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="/favicon.svg" />
  <title id="t">Kyzxx Proxy — Apps</title>
  <link rel="stylesheet" href="/assets/css/kyzxx.css?v=1" />
  <script src="/assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="/assets/mathematics/config.js?v=2025-04-15"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <main class="kz-main">
    <h1 class="kz-page-title">Apps</h1>

    <form id="fv" class="kz-search-bar" method="POST" onsubmit="return false;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="input" type="text" placeholder="Search apps…" autocomplete="off" oninput="filterCards()" />
    </form>

    <select id="category" class="kz-btn" style="margin-bottom:16px;" onchange="filterCards()">
      <option value="all">All</option>
      <option value="social">Social</option>
      <option value="stream">Stream</option>
      <option value="message">Message</option>
      <option value="media">TV & Movies</option>
      <option value="game">Game Sites</option>
      <option value="cloud">Cloud Gaming</option>
      <option value="tool">Tools</option>
      <option value="ai">AI</option>
      <option value="emu">Emulator</option>
      <option value="mail">Mail</option>
    </select>

    <div class="kz-card-grid" id="apps-grid"></div>
  </main>

  <script src="/assets/js/mg-pxy.js"></script>
  <script src="/assets/js/index-3.js"></script>
  <script src="/assets/languagearts/sj.all.js?v=2025-04-15"></script>
  <script src="/assets/js/sj-tp.js?v=2025-04-15"></script>
  <script src="/assets/js/m1.js"></script>
  <script src="/assets/js/kyzxx-shell.js?v=1"></script>
  <script>
    let allApps = [];

    fetch("/assets/json/a.json").then(r => r.json()).then(data => {
      allApps = data.filter(a => !a.name.startsWith("!"));
      renderApps(allApps);
    });

    function renderApps(list) {
      const grid = document.getElementById("apps-grid");
      if (list.length === 0) {
        grid.innerHTML = `<p style="color:var(--text-muted);">No apps found.</p>`;
        return;
      }
      grid.innerHTML = list.map(a => `
        <div class="kz-app-card" onclick="handleClick(${JSON.stringify(a).replace(/"/g, '"')})" role="button" tabindex="0">
          <img src="${a.image || ''}" alt="${a.name}" loading="lazy" onerror="this.style.display='none'" />
          <div class="kz-app-card-body">
            <h3>${a.name}</h3>
          </div>
        </div>
      `).join("");
    }

    function handleClick(app) {
      if (app.say) alert(app.say);
      if (app.link) go(app.link);
    }

    function filterCards() {
      const query = document.getElementById("input").value.toLowerCase();
      const cat = document.getElementById("category").value;
      let filtered = allApps;
      if (cat !== "all") filtered = filtered.filter(a => a.categories && a.categories.includes(cat));
      if (query) filtered = filtered.filter(a => a.name.toLowerCase().includes(query));
      renderApps(filtered);
    }
  </script>
</body>
</html>
