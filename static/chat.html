<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="/favicon.svg" />
  <title id="t">Kyzxx Proxy — Chat</title>
  <link rel="stylesheet" href="/assets/css/kyzxx.css?v=1" />
  <script src="/assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="/assets/mathematics/config.js?v=2025-04-15"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <main class="kz-main">
    <h1 class="kz-page-title">Chat</h1>

    <!-- Auth panel -->
    <div id="auth-panel" class="kz-card" style="max-width:400px;">
      <div style="display:flex;gap:0;margin-bottom:20px;">
        <button class="kz-btn kz-btn-primary" id="tab-login" style="flex:1;border-radius:10px 0 0 10px;" onclick="switchTab('login')">Log in</button>
        <button class="kz-btn" id="tab-register" style="flex:1;border-radius:0 10px 10px 0;" onclick="switchTab('register')">Register</button>
      </div>

      <form class="kz-form" id="auth-form" onsubmit="return false;">
        <div class="kz-form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="off" placeholder="4–12 characters" />
        </div>
        <div class="kz-form-group">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" placeholder="At least 6 characters" />
            <button type="button" onclick="togglePw()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;"><i class="fa-solid fa-eye" id="pw-icon"></i></button>
          </div>
        </div>
        <div class="kz-checkbox-row" id="terms-row">
          <input type="checkbox" id="terms" />
          <label for="terms">I agree to the terms of service</label>
        </div>
        <p class="kz-error" id="auth-error" style="display:none;"></p>
        <button type="submit" class="kz-btn kz-btn-primary" id="auth-submit" disabled>Log in</button>
      </form>
    </div>

    <!-- Chat panel (hidden until authed) -->
    <div id="chat-panel" style="display:none;">
      <div class="kz-chat-layout">
        <div class="kz-chat-sidebar kz-card" style="padding:12px;">
          <h3 style="font-size:0.9rem;margin-bottom:12px;">Rooms</h3>
          <div id="room-list"></div>
          <hr style="border-color:var(--border);margin:12px 0;">
          <div style="display:flex;align-items:center;gap:8px;font-size:0.85rem;">
            <i class="fa-solid fa-user" style="color:var(--accent);"></i>
            <span id="chat-username"></span>
            <button class="kz-btn" style="margin-left:auto;padding:6px 12px;font-size:0.75rem;" onclick="logout()">Logout</button>
          </div>
        </div>
        <div class="kz-chat-main kz-card" style="padding:16px;">
          <div class="kz-chat-messages" id="chat-messages"></div>
          <div class="kz-chat-input">
            <input type="text" id="chat-input" class="kz-form-group" style="flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;" placeholder="Type a message…" />
            <button class="kz-btn kz-btn-primary" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/mg-pxy.js"></script>
  <script src="/assets/js/index-3.js"></script>
  <script src="/assets/js/m1.js"></script>
  <script src="/assets/js/kyzxx-shell.js?v=1"></script>
  <script>
    let mode = "login";
    let currentRoom = "general";
    let chatWs = null;

    function switchTab(m) {
      mode = m;
      document.getElementById("tab-login").classList.toggle("kz-btn-primary", m === "login");
      document.getElementById("tab-register").classList.toggle("kz-btn-primary", m === "register");
      document.getElementById("terms-row").style.display = m === "register" ? "flex" : "none";
      document.getElementById("auth-submit").textContent = m === "login" ? "Log in" : "Register";
      validateForm();
    }

    function togglePw() {
      const pw = document.getElementById("password");
      const icon = document.getElementById("pw-icon");
      if (pw.type === "password") { pw.type = "text"; icon.className = "fa-solid fa-eye-slash"; }
      else { pw.type = "password"; icon.className = "fa-solid fa-eye"; }
    }

    function validateForm() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      const t = document.getElementById("terms").checked;
      let valid = u.length >= 4 && u.length <= 12 && p.length >= 6;
      if (mode === "register") valid = valid && t;
      document.getElementById("auth-submit").disabled = !valid;
    }

    document.getElementById("username").addEventListener("input", validateForm);
    document.getElementById("password").addEventListener("input", validateForm);
    document.getElementById("terms").addEventListener("change", validateForm);

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("auth-error");
      errEl.style.display = "none";

      try {
        const res = await fetch(`/api/auth/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || "Something went wrong.";
          errEl.style.display = "block";
          return;
        }
        showChat(data.username);
      } catch (err) {
        errEl.textContent = "Network error.";
        errEl.style.display = "block";
      }
    });

    async function showChat(username) {
      document.getElementById("auth-panel").style.display = "none";
      document.getElementById("chat-panel").style.display = "block";
      document.getElementById("chat-username").textContent = username;

      // Load rooms
      const roomsRes = await fetch("/api/chat/rooms");
      const roomsData = await roomsRes.json();
      const roomList = document.getElementById("room-list");
      roomList.innerHTML = roomsData.rooms.map(r =>
        `<div class="kz-history-item" onclick="joinRoom('${r.id}')" id="room-${r.id}" style="cursor:pointer;">#${r.name}</div>`
      ).join("");
      joinRoom("general");
    }

    function joinRoom(room) {
      currentRoom = room;
      document.querySelectorAll("[id^=room-]").forEach(el => el.classList.remove("active"));
      const el = document.getElementById(`room-${room}`);
      if (el) el.style.color = "var(--accent)";

      if (chatWs) chatWs.close();

      const proto = location.protocol === "https:" ? "wss" : "ws";
      chatWs = new WebSocket(`${proto}://${location.host}/api/chat/ws?room=${room}`);

      chatWs.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "history") {
          const el = document.getElementById("chat-messages");
          el.innerHTML = data.messages.map(m =>
            `<div class="kz-chat-msg other"><div class="author">${m.username}</div>${escapeHtml(m.content)}</div>`
          ).join("");
          el.scrollTop = el.scrollHeight;
        } else if (data.type === "message") {
          const el = document.getElementById("chat-messages");
          const self = data.username === document.getElementById("chat-username").textContent;
          const div = document.createElement("div");
          div.className = `kz-chat-msg ${self ? "self" : "other"}`;
          div.innerHTML = `<div class="author">${escapeHtml(data.username)}</div>${escapeHtml(data.content)}`;
          el.appendChild(div);
          el.scrollTop = el.scrollHeight;
        }
      };
    }

    function sendMessage() {
      const input = document.getElementById("chat-input");
      if (!input.value.trim() || !chatWs || chatWs.readyState !== WebSocket.OPEN) return;
      chatWs.send(JSON.stringify({ type: "message", content: input.value }));
      input.value = "";
    }

    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function logout() {
      await fetch("/api/auth/logout", { method: "POST" });
      location.reload();
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // Check if already logged in
    (async () => {
      try {
        const res = await fetch("/api/auth/me");
        const data = await res.json();
        if (data.authenticated) showChat(data.username);
        else switchTab("login");
      } catch { switchTab("login"); }
    })();
  </script>
</body>
</html>
