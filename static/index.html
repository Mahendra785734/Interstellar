<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Interstellar</title>
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/h.css?v=01" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { color-scheme: dark; --cyan:#8de8ff; --muted:#aab3c5; }
    body.center { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 34%,#242d43 0%,#171b2a 45%,#10131d 100%); color:#f6f8ff; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow-x:hidden; }
    .f-nav { position:relative; z-index:5; }
    #particles-js { min-height:calc(100vh - 2px); position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #particles-js:before,#particles-js:after { content:""; position:absolute; border:1px solid #a2eaff12; border-radius:50%; width:560px;height:560px; pointer-events:none; }
    #particles-js:after { width:760px;height:760px; }
    #particles-js > canvas { position:absolute; inset:0; opacity:.18; pointer-events:none; }
    .main { z-index:1; position:relative; width:min(760px,calc(100% - 32px)); margin:-4vh auto 0; text-align:center; display:flex; align-items:center; flex-direction:column; }
    .date-line { position:absolute; top:24px; left:clamp(18px,4vw,52px); right:clamp(18px,4vw,52px); display:flex; align-items:center; justify-content:space-between; color:#e2e7f2; font-size:12px; font-weight:600; letter-spacing:.02em; }
    .date-line span:last-child { display:flex;align-items:center;gap:9px; }
    .date-line i { color:var(--cyan); }
    h1.title { margin:0; display:flex; align-items:center; justify-content:center; gap:12px; font-size:clamp(38px,7vw,58px); line-height:1.1; letter-spacing:.025em; font-weight:750; color:#a5eaff; text-shadow:0 0 35px #69dfff25; }
    h1.title:before { content:""; width:42px;height:34px; display:inline-block; flex-shrink:0; background:linear-gradient(135deg,#9ff2ff,#70d7f3); clip-path:polygon(0 36%,58% 36%,58% 0,100% 50%,58% 100%,58% 64%,0 64%,0 54%,72% 54%,72% 46%,0 46%); }
    #splash { min-height:18px; margin:14px 0 32px; color:#9ea9bf; font-size:13px; }
    .search-container { width:min(100%,520px); }
    #fv { display:flex; align-items:center; gap:9px; width:100%; }
    #input { box-sizing:border-box; width:100%; min-width:0; height:52px; border:1px solid #ffffff16; border-radius:16px; padding:0 22px; background:#0e111bd9; color:#f7f9ff; outline:none; font-size:14px; box-shadow:0 12px 36px #0002; transition:border-color .2s,box-shadow .2s,background .2s; }
    #input::placeholder { color:#a3adbf; opacity:1; }
    #input:focus { border-color:#8de8ff99; box-shadow:0 0 0 4px #8de8ff12,0 12px 36px #0002; background:#101522; }
    .search-submit { flex:0 0 48px;height:48px;border:0;border-radius:15px;background:linear-gradient(135deg,#b0f1ff,#7ddcf5);color:#172638;font-size:18px;cursor:pointer;transition:transform .2s,filter .2s; }
    .search-submit:hover { transform:translateY(-2px);filter:brightness(1.07); }
    .engine-wrap { position:relative; margin-bottom:12px; display:flex; justify-content:center; }
    .engine-chip { border:1px solid #ffffff17;background:#ffffff08;color:#e7ebf5;border-radius:999px;padding:8px 14px;font-size:12px; }
    .favorites { display:flex;justify-content:center;gap:14px;margin-top:35px; }
    .favorite { display:flex;flex-direction:column;align-items:center;gap:9px;color:#aab4c7;text-decoration:none;font-size:11px;min-width:76px; }
    .favorite-icon { width:54px;height:54px;border:1px solid #ffffff1c;border-radius:17px;display:grid;place-items:center;background:#ffffff08;color:#dce7f8;font-size:19px;transition:all .2s; }
    .favorite:hover .favorite-icon { background:#8de8ff16;border-color:#8de8ff77;color:var(--cyan);transform:translateY(-3px); }
    .favorite.add .favorite-icon { border-style:dashed;background:#ffffff04;font-size:22px; }
    .bottom-links { position:absolute;bottom:22px;left:clamp(18px,4vw,52px);display:flex;gap:9px;z-index:2; }
    .bottom-links a,.bottom-links button { width:36px;height:36px;border:1px solid #ffffff14;border-radius:50%;background:#ffffff0a;color:#aebbd0;display:grid;place-items:center;text-decoration:none;cursor:pointer; }
    .bottom-links a:hover,.bottom-links button:hover { color:var(--cyan);border-color:#8de8ff66; }
    .made-by { position:absolute;right:clamp(18px,4vw,52px);bottom:29px;color:#aeb5c5;font-size:12px;font-weight:600; }
    .made-by span { color:#ff829c; }
    @media(max-width:520px) { .main{margin-top:-2vh}.date-line{top:18px;font-size:10px} h1.title{gap:8px} h1.title:before{width:30px;height:26px} #splash{margin-bottom:25px}.favorites{margin-top:28px}.made-by{font-size:10px;bottom:32px}.bottom-links{bottom:20px} }
  </style>
</head>
<body class="center">
  <div class="f-nav"></div>
  <div id="particles-js">
    <div class="date-line"><span id="today">Welcome back</span><span><i class="fa-regular fa-clock"></i><time id="clock">--:--</time></span></div>
    <div class="main">
      <h1 class="title">Interstellar</h1>
      <p id="splash">Your space to explore.</p>
      <div class="search-container">
        <div class="engine-wrap"><span class="engine-chip"><i class="fa-brands fa-google" style="margin-right:7px;color:#9de8ff"></i> Search the web <i class="fa-solid fa-chevron-down" style="margin-left:8px;font-size:10px"></i></span></div>
        <form id="fv" method="POST">
          <input id="input" class="truncate" placeholder="Search or enter a URL" type="text" autocomplete="off" aria-label="Search or enter a URL" />
          <button class="search-submit" type="submit" aria-label="Search"><i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
      <div class="favorites">
        <a class="favorite" href="/b"><span class="favorite-icon"><i class="fa-solid fa-layer-group"></i></span><span>Apps</span></a>
        <a class="favorite" href="/a"><span class="favorite-icon"><i class="fa-solid fa-gamepad"></i></span><span>Games</span></a>
        <a class="favorite" href="/c"><span class="favorite-icon"><i class="fa-solid fa-sliders"></i></span><span>Settings</span></a>
        <button class="favorite add" id="add-favorite" type="button" style="border:0;background:transparent;cursor:pointer"><span class="favorite-icon"><i class="fa-solid fa-plus"></i></span><span>Add shortcut</span></button>
      </div>
    </div>
    <div class="bottom-links">
      <a href="/b" aria-label="Apps" title="Apps"><i class="fa-solid fa-grip"></i></a>
      <a href="https://github.com/Mahendra785734/Interstellar" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub"><i class="fa-brands fa-github"></i></a>
    </div>
    <div class="made-by">Made for exploring <span>♥</span></div>
  </div>
  <script>
    (() => {
      const updateClock = () => {
        const now = new Date();
        const date = document.getElementById("today");
        const clock = document.getElementById("clock");
        if (date) date.textContent = now.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
        if (clock) clock.textContent = now.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
      };
      updateClock();
      setInterval(updateClock, 30000);
      const add = document.getElementById("add-favorite");
      if (add) add.addEventListener("click", () => {
        const url = window.prompt("Enter a website URL (example.com):");
        if (!url) return;
        const normalized = /^https?:\/\//i.test(url) ? url : "https://" + url;
        try {
          const parsed = new URL(normalized);
          const link = document.createElement("a");
          link.className = "favorite";
          link.href = parsed.href;
          link.innerHTML = '<span class="favorite-icon"><i class="fa-solid fa-globe"></i></span><span></span>';
          link.querySelector("span:last-child").textContent = parsed.hostname.replace(/^www\./, "");
          document.querySelector(".favorites").insertBefore(link, add);
        } catch (_) { window.alert("Please enter a valid website address."); }
      });
    })();
  </script>

</body>
</html>
